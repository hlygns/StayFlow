# Sunucudaki (host) Nginx ayari - /etc/nginx/sites-available/stayflow
#
# Sadece HTTP ile baslar. Certbot calistirilinca (bkz. docs/deploy.md) bu dosyaya 443/HTTPS
# blogunu ve HTTP -> HTTPS yonlendirmesini KENDISI ekler; sertifikayi da 90 gunde bir yeniler.
#
# "stayflow.example.com" yerine kendi alan adinizi yazin.

server {
    listen 80;
    listen [::]:80;
    server_name stayflow.example.com;

    # Gzip: JSON ve JS/CSS yanitlari kucultulur
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    # SignalR canli baglantisi: token adres satirinda gelir (?access_token=), loglara yazilmasin
    location /hubs/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        access_log off;
    }

    location / {
        # Docker'daki panel container'i (sadece 127.0.0.1'e acik)
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # API, istegin aslinda HTTPS ile geldigini bu basliktan anlar
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (SignalR, bkz. /hubs/)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# WebSocket baglantilari icin "Connection" basligini ayarla
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
