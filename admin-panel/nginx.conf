# Panel container'inin Nginx ayari:
#  - React'in derlenmis dosyalarini sunar
#  - /api isteklerini ayni Docker agindaki API container'ina iletir (tarayici tek origin gorur, CORS gerekmez)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API adresini Docker'in ic DNS'inden (127.0.0.11) her 10 sn'de bir yeniden coz.
    # Nginx "proxy_pass http://api:8080" yazilinca adresi SADECE acilista cozer; API container'i
    # yeniden olusturulunca (her deploy) yeni IP alir ve panel 502 vermeye baslar. Adres bir
    # degiskende tutulunca Nginx her istekte resolver'a sorar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Guvenlik basliklari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Onde TLS'i sonlandiran bir proxy varsa onun soyledigi semayi koru
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SignalR (WebSocket). Erisim logu kapali: tarayici token'i ?access_token=... ile gonderir,
    # adres satirindaki token log dosyalarina yazilmasin.
    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 1h;
        access_log off;
    }

    # Vite dosya adlarina hash ekler (index-DhReNHhj.js): icerik degisince ad da degisir,
    # bu yuzden bir yil boyunca onbellekte tutulabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: /calendar gibi adresler sunucuda dosya olarak yok - hepsi index.html'e gider,
    # yonlendirmeyi React Router yapar. index.html onbelleklenmez ki yeni surum hemen gelsin.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
