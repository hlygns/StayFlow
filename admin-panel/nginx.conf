# Panel container'inin Nginx ayari:
#  - React'in derlenmis dosyalarini sunar
#  - /api isteklerini ayni Docker agindaki API container'ina iletir (tarayici tek origin gorur, CORS gerekmez)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Guvenlik basliklari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Onde TLS'i sonlandiran bir proxy varsa onun soyledigi semayi koru
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Vite dosya adlarina hash ekler (index-DhReNHhj.js): icerik degisince ad da degisir,
    # bu yuzden bir yil boyunca onbellekte tutulabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: /calendar gibi adresler sunucuda dosya olarak yok - hepsi index.html'e gider,
    # yonlendirmeyi React Router yapar. index.html onbelleklenmez ki yeni surum hemen gelsin.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
